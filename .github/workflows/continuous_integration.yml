name: Continuous Integration

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.config.name }} | ${{ matrix.config.build_type }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Visual Studio 2022
          os: windows-2022
          build_type: Release

        - name: Visual Studio 2022
          os: windows-2022
          build_type: Debug

        - name: macOS
          os: macos-14
          deps_cmdline: brew install libvpx molten-vk vulkan-volk
          build_type: Release

        - name: macOS
          os: macos-14
          extra_options: -G Xcode -DDYN_OPENAL=OFF
          deps_cmdline: brew install libvpx molten-vk vulkan-volk
          build_type: Debug

        - name: Linux GCC 9 # oldest version available
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=gcc-9 -DCMAKE_CXX_COMPILER=g++-9
          deps_cmdline: sudo apt-get update && sudo apt-get install gcc-9 g++-9 libinput-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev libegl-dev libdbus-1-dev libfontconfig1-dev libvpx-dev libgtk2.0-dev libwebp-dev
          build_type: RelWithDebInfo

        - name: Linux GCC 12 # last known good
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12
          deps_cmdline: sudo apt-get update && sudo apt-get install libinput-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev libegl-dev libdbus-1-dev libfontconfig1-dev libvpx-dev libgtk-3-dev libwebp-dev
          build_type: MinSizeRel
          export_appimage: true

        # The only job that configures HAVE_VULKAN, which defaults OFF.
        # HAVE_VULKAN=ON did not compile at all until 2026-08-10 --
        # nativevideo.cpp called I_GetVulkanPlatformExtensions and
        # I_CreateVulkanSurface above their definitions, with no POSIX header
        # declaring them -- and it went unnoticed for as long as it did because
        # nothing in this workflow had ever configured the option.
        #
        # A separate entry rather than the flag added to a Linux job that
        # already exists, because HAVE_VULKAN changes what such a job would be
        # testing: DEFAULT_RENDER_BACKEND becomes 1 (v_video.cpp), so the smoke
        # test would start asking for a Vulkan device on a runner that has no
        # GPU, and the uploaded package would be a binary whose default backend
        # is Vulkan. Hence compile_only -- this job builds and stops, which is
        # all CI can honestly claim about a backend it cannot run.
        #
        # No extra apt packages: ZVulkan vendors the Vulkan headers, reaches the
        # loader through volk (dlopen, nothing links libvulkan), and its
        # VULKAN_USE_XLIB default pulls in only <X11/Xlib.h>, which the
        # libx11-dev already listed here provides.
        - name: Linux GCC 12 Vulkan # compile coverage for HAVE_VULKAN=ON
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DHAVE_VULKAN=ON
          deps_cmdline: sudo apt-get update && sudo apt-get install libinput-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev libegl-dev libdbus-1-dev libfontconfig1-dev libvpx-dev libgtk-3-dev libwebp-dev
          build_type: RelWithDebInfo
          compile_only: true

        - name: Linux GCC Latest # rolling default, not actually latest
          os: ubuntu-latest
          extra_options: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          deps_cmdline: sudo apt-get update && sudo apt-get install libinput-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev libegl-dev libdbus-1-dev libfontconfig1-dev libvpx-dev libwebp-dev
          build_type: Release
          export_appimage: true

        - name: Linux Clang 11 # oldest version available
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-11 -DCMAKE_CXX_COMPILER=clang++-11 -DDYN_OPENAL=OFF
          deps_cmdline: sudo apt-get update && sudo apt-get install clang-11 libinput-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev libegl-dev libdbus-1-dev libfontconfig1-dev libvpx-dev libopenal-dev libwebp-dev
          build_type: Debug

        - name: Linux Clang 15 # last known good
          os: ubuntu-22.04
          extra_options: -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15
          deps_cmdline: sudo apt-get update && sudo apt-get install clang-15 libinput-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev libegl-dev libdbus-1-dev libfontconfig1-dev libvpx-dev libwebp-dev
          build_type: Release
          export_appimage: true

        - name: Linux Clang Latest # rolling default, not actually latest
          os: ubuntu-latest
          extra_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          deps_cmdline: sudo apt-get update && sudo apt-get install libinput-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev libegl-dev libdbus-1-dev libfontconfig1-dev libvpx-dev libwebp-dev
          build_type: Release
          export_appimage: true

    steps:
    - uses: actions/checkout@v5

    - name: Install Dependencies
      shell: bash
      run: |
        if [[ -n "${{ matrix.config.deps_cmdline }}" ]]; then
          eval ${{ matrix.config.deps_cmdline }}
        fi
        mkdir build

    # Supplies GIT_DESCRIBE, which is only a version string: UpdateRevision.cmake
    # falls back to `git describe --tags --dirty=-m` when it is unset. This step
    # reaches the GitHub GraphQL API, so a network or TLS fault on the runner
    # used to fail the whole job for a cosmetic value -- macOS Release died on
    # `x509: certificate signed by unknown authority` on 2026-08-12 while the
    # Debug job on the same commit passed. Let it fail soft.
    - name: Git describe
      id: ghd
      continue-on-error: true
      uses: proudust/gh-describe@v2

    - name: Configure
      shell: bash
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} -DPK3_QUIET_ZIPDIR=ON ${{ matrix.config.extra_options }} .

    - name: Build
      shell: bash
      run: |
        # Only export it when non-empty. The describe step is continue-on-error,
        # so its output is "" when it fails -- and CMake's `if(DEFINED ENV{...})`
        # is true for a variable set to an empty string, which would pin the
        # version to nothing and skip the `git describe` fallback that exists
        # precisely for this case.
        DESCRIBE="${{ steps.ghd.outputs.describe }}"
        if [[ -n "$DESCRIBE" ]]; then export GIT_DESCRIBE="$DESCRIBE"; fi
        export MAKEFLAGS=--keep-going
        cmake --build build --config ${{ matrix.config.build_type }} --parallel 3

    # Compiling and linking says nothing about whether the binary starts.
    # Covers startup as far as +quit reaches: display backend, widget resources
    # and fonts, and the WAD filesystem. It stops short of full game init --
    # script parsing, the texture manager, rendering a frame -- because +quit
    # short-circuits before a map can load.
    # 8b4746558 passed every job in this workflow while dying on startup with
    # "Unable to find widgets/font/system.ttf", because nothing here had ever
    # launched it. This runs the real binary through full initialisation --
    # video backend, widget resources, fonts, IWAD load -- and quits.
    #
    # Linux only: this is where the native Wayland/X11 backend lives, and it is
    # the configuration with no other coverage. Runs under Xvfb with the X11
    # backend forced, since the runners have no compositor.
    #
    # Blocking: the step passed on all six Linux jobs on its first run, headless
    # Xvfb and libinput-without-a-seat included, which were the parts that could
    # not be checked locally. A binary that will not start should fail the build.
    # Skipped on compile_only jobs: the Vulkan build's default backend is
    # Vulkan, so this would either fall back to OpenGL (testing the fallback,
    # not the default) or fail the GL_VERSION grep outright, depending on what
    # the runner image happens to have installed. Neither answers anything
    # about the Vulkan backend, which needs a GPU this runner does not have.
    - name: Smoke test (start and quit)
      if: runner.os == 'Linux' && !matrix.config.compile_only
      shell: bash
      run: |
        sudo apt-get install -y xvfb
        curl -sSL -o freedoom.zip https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip
        unzip -q -j freedoom.zip '*/freedoom2.wad' -d build
        cd build
        export ZWIDGET_DISPLAY_BACKEND=X11
        timeout 120 xvfb-run -a ./gzdoom -iwad freedoom2.wad -nosound +quit 2>&1 | tee startup.log
        # Exit status alone would also be satisfied by bailing out before doing
        # anything, so require evidence that startup actually got somewhere.
        grep -q "W_Init: Init WADfiles" startup.log
        grep -q "GL_VERSION" startup.log
        echo "startup smoke test passed"

    # The ${{ }} here is not decoration: a bare `if:` value that STARTS with !
    # is a YAML tag, not an expression, and the file stops parsing.
    - name: Create Package
      if: ${{ !matrix.config.compile_only }}
      shell: bash
      run: |
        cd build
        mkdir package
        if [[ "${{ runner.os }}" == 'Windows' ]]; then
          cp ${{ matrix.config.build_type }}/gzdoom.exe ${{ matrix.config.build_type }}/*.pk3 ${{ matrix.config.build_type }}/zmusic.dll package
        elif [[ "${{ runner.os }}" == 'macOS' ]]; then
          if [[ "${{ matrix.config.build_type }}" != 'Release' ]]; then
            mv ${{ matrix.config.build_type }}/gzdoom.app gzdoom.app
          fi
          cp -r gzdoom.app package
        elif [[ "${{ runner.os }}" == 'Linux' ]]; then
          if [[ -n "${{ matrix.config.export_appimage }}" ]]; then
            mkdir AppDir
            cmake --install . --prefix "$(realpath AppDir)/usr"

            sudo apt-get install libfuse2 # renamed to libfuse2t64 in later releases
            wget -qO - https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage \
              | tee appimage-builder | sha1sum
            echo "6f83a789f6c47a745b97d1b0b3f1df2e7eea7a09 appimage-builder" | sha1sum -c -
            chmod +x appimage-builder

            # Non-empty guard, same reason as the Build step above.
            DESCRIBE="${{ steps.ghd.outputs.describe }}"
            if [[ -n "$DESCRIBE" ]]; then export GIT_DESCRIBE="$DESCRIBE"; fi
            ./appimage-builder --skip-tests --recipe ../tools/AppImageBuilder.yml
            cp *.AppImage package
          else
            cp gzdoom *.pk3 libzmusic.so* package
          fi
        fi

    - name: Upload Package
      if: ${{ !matrix.config.compile_only }}
      uses: actions/upload-artifact@v5
      with:
        path: build/package
        name: ${{ matrix.config.name }} ${{ matrix.config.build_type }}

    - name: List Build Directory
      if: always()
      shell: bash
      run: |
        git status
        ls -lR build
